<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 선택자</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- 태그 선택자 -->
    <h1>CSS 선택자</h1>
    <p>p 태그 색상 변경</p>
    <p>p 태그 글자 크기 변경</p>
    <!-- 클래스 선택자 -->
    <h2 class="menu1">김치찌개</h2>
    <h2 class="menu2">된장찌개</h2>
    <h2 class="menu3">비빔밥</h2>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <!-- 아이디 선택자 -->
    <span id="title">오늘의 메뉴</span>
    <p id="title2">오늘 할일</p>
    <h3 id="subTitle" class="subTitle subTitle2">클래스 여러개</h3>
    <!-- 여러 선택자 한꺼번에 -->
    <h4>메뉴</h4>
    <p class="description">Lorem ipsum dolor sit amet.</p>
    <span class="smallTitle">안녕하세요</span>
  </body>
</html>
